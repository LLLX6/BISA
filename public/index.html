<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF5A36">
  <meta name="description" content="بيسا — اكتشافاتك، قريبة منك. منتجات مختارة من 100 بيسة إلى 2 ر.ع من متاجر قريبة.">
  <meta name="color-scheme" content="light">
  <title>BISA | بيسا</title>
  <link rel="icon" href="assets/brand/bisa-mark.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/styles/bisa.css">
</head>
<body>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div id="app" class="app-shell">
    <header class="app-header">
      <button id="brandButton" class="brand-button" type="button" aria-label="العودة إلى الرئيسية">
        <img src="assets/brand/bisa-logo.svg" alt="BISA | بيسا">
      </button>
      <div class="header-actions">
        <button id="locationButton" class="location-pill" type="button" aria-label="اختر موقعك">
          <span aria-hidden="true">⌖</span><strong id="locationLabel">مسقط</strong><small>⌄</small>
        </button>
        <button id="notificationButton" class="icon-button" type="button" aria-label="الإشعارات">
          <span aria-hidden="true">♢</span><b id="notificationBadge" hidden>0</b>
        </button>
        <button id="languageButton" class="language-button" type="button" aria-label="Switch language">EN</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="viewRoot" aria-live="polite"></section>
    </main>

    <nav id="shopperNav" class="bottom-nav" aria-label="التنقل الرئيسي">
      <button type="button" data-view="home" aria-current="page"><span aria-hidden="true">⌂</span><b data-i18n="navHome">الرئيسية</b></button>
      <button type="button" data-view="explore"><span aria-hidden="true">⌕</span><b data-i18n="navExplore">استكشف</b></button>
      <button type="button" data-view="cart" class="cart-nav"><span aria-hidden="true">▱</span><b data-i18n="navCart">السلة</b><em id="cartBadge" hidden>0</em></button>
      <button type="button" data-view="orders"><span aria-hidden="true">▤</span><b data-i18n="navOrders">طلباتي</b></button>
      <button type="button" data-view="account"><span aria-hidden="true">◎</span><b data-i18n="navAccount">حسابي</b></button>
    </nav>

    <nav id="merchantNav" class="bottom-nav merchant-nav" aria-label="تنقل مساحة التاجر" hidden>
      <button type="button" data-merchant-view="today" aria-current="page"><span aria-hidden="true">◉</span><b data-i18n="merchantToday">اليوم</b></button>
      <button type="button" data-merchant-view="merchantOrders"><span aria-hidden="true">▤</span><b data-i18n="merchantOrders">الطلبات</b></button>
      <button type="button" data-merchant-view="catalog"><span aria-hidden="true">▦</span><b data-i18n="merchantCatalog">الكتالوج</b></button>
      <button type="button" data-merchant-view="promotions"><span aria-hidden="true">◇</span><b data-i18n="merchantPromotions">الترويج</b></button>
      <button type="button" data-merchant-view="merchantMore"><span aria-hidden="true">•••</span><b data-i18n="merchantMore">المزيد</b></button>
    </nav>
  </div>

  <div id="sheetRoot" class="sheet-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

  <template id="sheetTemplate">
    <div class="sheet-backdrop" data-close-sheet></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header><div><p id="sheetEyebrow"></p><h2 id="sheetTitle"></h2></div><button class="icon-button" type="button" data-close-sheet aria-label="إغلاق">×</button></header>
      <div id="sheetContent" class="sheet-content"></div>
    </section>
  </template>

  <script src="assets/scripts/bisa-app.js" defer></script>
</body>
</html>
