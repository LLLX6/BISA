  <div id="app" class="app-shell">
    <header class="app-header" aria-label="">
      <div class="header-inner">
        <button id="brandButton" class="brand-button" type="button">
          <img src="assets/brand/bisa-logo.svg" alt="BISA | بيسا">
        </button>
        <button id="locationButton" class="location-pill" type="button">
          <span class="location-icon"><svg><use href="#i-pin"/></svg></span>
          <span class="location-copy"><small id="locationEyebrow"></small><strong id="locationLabel">مسقط</strong></span>
          <svg class="chevron-icon"><use href="#i-chevron"/></svg>
        </button>
        <nav id="desktopNav" class="desktop-nav" aria-label=""></nav>
        <div class="header-actions">
          <button id="notificationButton" class="icon-button" type="button">
            <svg><use href="#i-bell"/></svg><b id="notificationBadge" hidden>0</b>
          </button>
          <button id="accountButton" class="icon-button account-button" type="button">
            <svg><use href="#i-user"/></svg>
          </button>
          <button id="languageButton" class="language-button" type="button">EN</button>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="pageStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="viewRoot"></section>
    </main>

    <nav id="shopperNav" class="bottom-nav" aria-label=""></nav>
    <nav id="merchantNav" class="bottom-nav merchant-nav" aria-label="" hidden></nav>
