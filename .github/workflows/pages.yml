name: BISA static preview (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_BISA_PREVIEW after owner approval"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bisa-pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_BISA_PREVIEW' && github.actor == github.repository_owner }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install BISA Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Run BISA Python suite
        run: python -m unittest discover -s tests -p "test_bisa*.py" -v
      - name: Run responsive PWA suite
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Verify static shell before upload
        run: python scripts/verify_bisa.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy owner-approved static preview
        id: deployment
        uses: actions/deploy-pages@v4
