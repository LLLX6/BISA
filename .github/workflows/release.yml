name: Build BISA source archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r bisa-source-${{ github.sha }}.zip . -x '.git/*' 'node_modules/*' 'data-bisa/*' '.env'
      - uses: actions/upload-artifact@v4
        with:
          name: bisa-source-${{ github.sha }}
          path: bisa-source-${{ github.sha }}.zip
          retention-days: 14
